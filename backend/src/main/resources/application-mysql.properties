spring.autoconfigure.exclude=
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reon}
spring.datasource.username=${DB_USERNAME:reon}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE_UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
memory.enabled=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/memory-schema.sql
