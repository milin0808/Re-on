spring.autoconfigure.exclude=
spring.datasource.url=jdbc:h2:mem:memorytests;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE_UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/memory-schema.sql
memory.enabled=true
memory.engine.token=reon-local-integration-token
memory.engine.poll-delay-ms=3600000
